# Hosted demo profile (Render). Activated by SPRING_PROFILES_ACTIVE=demo in the Dockerfile.
# Runs on an in-memory H2 database in MySQL mode, so no external database is needed.
# DatabaseSeeder fills it with sample companies, users and complaints on every start,
# so the demo resets to a clean state whenever the instance restarts.
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:complaint_platform_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Never send real email from the demo; emails are logged to the console instead.
cms.email.enabled=false
spring.mail.username=
spring.mail.password=

cms.upload.path=/tmp/uploads
